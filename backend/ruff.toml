target-version = "py311"

[lint]
# The rule set we lint against, written out so a ruff upgrade does not change it (0.17 widened the defaults
# with ~380 style rewrites: PEP 604/585 annotations, import order). Adopt those in their own change if wanted.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# .env must be loaded before app modules read os.environ at import time.
"app/main.py" = ["E402"]
