services:
  backend:
    build:
      context: ./backend
    container_name: pazarlab-backend
    ports:
      # Bound to localhost only; put a reverse proxy in front for public deployments.
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - pazarlab-data:/app/data
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: pazarlab-frontend
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pazarlab-data:
